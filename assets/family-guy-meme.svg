<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f0a2e"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- road -->
  <rect x="0" y="330" width="960" height="150" fill="#374151"/>
  <line x1="0" y1="405" x2="960" y2="405" stroke="#fbbf24" stroke-width="6" stroke-dasharray="40 30"/>
  <line x1="0" y1="330" x2="960" y2="330" stroke="#9ca3af" stroke-width="4"/>
  <line x1="0" y1="480" x2="960" y2="480" stroke="#9ca3af" stroke-width="4"/>

  <!-- car (steering across lanes) -->
  <g transform="translate(520,330) rotate(-18)">
    <!-- body -->
    <rect x="-80" y="-30" width="160" height="40" rx="8" fill="#ef4444"/>
    <rect x="-45" y="-55" width="90" height="30" rx="10" fill="#ef4444"/>
    <!-- windows -->
    <rect x="-30" y="-50" width="25" height="20" rx="4" fill="#93c5fd"/>
    <rect x="5" y="-50" width="25" height="20" rx="4" fill="#93c5fd"/>
    <!-- wheels -->
    <circle cx="-45" cy="12" r="14" fill="#111827"/>
    <circle cx="45" cy="12" r="14" fill="#111827"/>
    <!-- turn signal -->
    <circle cx="80" cy="-8" r="9" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- meme text bubble 1 -->
  <g>
    <rect x="30" y="60" width="420" height="110" rx="16" fill="#fef3c7" stroke="#111827" stroke-width="4"/>
    <text x="50" y="105" fill="#111827" font-size="30" font-weight="bold">"How much turn signal</text>
    <text x="50" y="145" fill="#111827" font-size="30" font-weight="bold">do I need? Zero."</text>
  </g>

  <!-- meme text bubble 2 -->
  <g>
    <rect x="520" y="180" width="410" height="120" rx="16" fill="#fef3c7" stroke="#111827" stroke-width="4"/>
    <text x="540" y="225" fill="#111827" font-size="30" font-weight="bold">"I turn now.</text>
    <text x="540" y="265" fill="#111827" font-size="30" font-weight="bold">Good luck everybody else!"</text>
  </g>

  <!-- caption -->
  <text x="480" y="520" fill="#fbbf24" font-size="24" font-weight="bold" text-anchor="middle">CivicSense: the copilot that flags the Family Guy maneuver</text>
</svg>
