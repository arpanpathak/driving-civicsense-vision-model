<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- chart grid -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="120" y1="60" x2="120" y2="460"/>
    <line x1="120" y1="460" x2="880" y2="460"/>
    <line x1="120" y1="120" x2="880" y2="120"/>
    <line x1="120" y1="200" x2="880" y2="200"/>
    <line x1="120" y1="280" x2="880" y2="280"/>
    <line x1="120" y1="360" x2="880" y2="360"/>
  </g>

  <!-- axis labels -->
  <text x="100" y="66" fill="#9ca3af" font-size="20" text-anchor="end">cost $</text>
  <text x="100" y="466" fill="#9ca3af" font-size="20" text-anchor="end">watts</text>
  <text x="30" y="320" fill="#9ca3af" font-size="20" transform="rotate(-90 40 300)" text-anchor="middle">perf</text>

  <!-- red down line (cloud/subscription ADAS) -->
  <polyline points="150,120 260,150 370,180 480,220 590,270 700,330 810,410"
            fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <text x="810" y="430" fill="#ef4444" font-size="22" font-weight="bold">cloud ADAS + sub</text>

  <!-- green stonks line (CivicSense edge) -->
  <polyline points="150,430 260,395 370,350 480,300 590,235 700,150 810,70"
            fill="none" stroke="url(#lineGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="800" y="52" fill="#34d399" font-size="26" font-weight="bold" text-anchor="end">CivicSense edge</text>

  <!-- data points -->
  <g fill="#34d399">
    <circle cx="150" cy="430" r="9"/>
    <circle cx="260" cy="395" r="9"/>
    <circle cx="370" cy="350" r="9"/>
    <circle cx="480" cy="300" r="9"/>
    <circle cx="590" cy="235" r="9"/>
    <circle cx="700" cy="150" r="9"/>
    <circle cx="810" cy="70" r="9"/>
  </g>

  <!-- STONKS header -->
  <text x="480" y="510" fill="#34d399" font-size="64" font-weight="bold" text-anchor="middle" filter="url(#glow)">STONKS</text>
  <text x="480" y="536" fill="#6ee7b7" font-size="24" text-anchor="middle">performance / watt / dollar</text>
</svg>
