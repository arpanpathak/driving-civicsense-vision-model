<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  
  <!-- Road perspective lines -->
  <g opacity="0.15">
    <polygon points="200,200 50,380 350,380" fill="url(#road)"/>
    <line x1="200" y1="200" x2="120" y2="380" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="200" x2="280" y2="380" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="240" x2="200" y2="380" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,8"/>
  </g>

  <!-- Camera lens outer ring -->
  <circle cx="200" cy="180" r="70" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Camera lens inner ring -->
  <circle cx="200" cy="180" r="55" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  
  <!-- Camera lens -->
  <circle cx="200" cy="180" r="45" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
  
  <!-- Lens reflection -->
  <ellipse cx="185" cy="165" rx="15" ry="10" fill="url(#accent)" opacity="0.15"/>
  <ellipse cx="185" cy="165" rx="8" ry="5" fill="url(#accent)" opacity="0.25"/>

  <!-- Eye / crosshair in lens -->
  <circle cx="200" cy="180" r="12" fill="none" stroke="url(#accent2)" stroke-width="2" filter="url(#glow)"/>
  <line x1="188" y1="180" x2="212" y2="180" stroke="url(#accent2)" stroke-width="2"/>
  <line x1="200" y1="168" x2="200" y2="192" stroke="url(#accent2)" stroke-width="2"/>

  <!-- Signal / broadcast waves -->
  <g filter="url(#glowStrong)">
    <path d="M 160,130 A 65,65 0 0,1 240,130" fill="none" stroke="url(#accent2)" stroke-width="2.5" opacity="0.7"/>
    <path d="M 140,110 A 90,90 0 0,1 260,110" fill="none" stroke="url(#accent2)" stroke-width="2" opacity="0.45"/>
    <path d="M 120,90 A 120,120 0 0,1 280,90" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Mesh dot nodes -->
  <circle cx="160" cy="130" r="3" fill="url(#accent2)" filter="url(#glow)"/>
  <circle cx="240" cy="130" r="3" fill="url(#accent2)" filter="url(#glow)"/>
  <circle cx="140" cy="110" r="2.5" fill="url(#accent2)" opacity="0.6"/>
  <circle cx="260" cy="110" r="2.5" fill="url(#accent2)" opacity="0.6"/>

  <!-- Bottom lane bars -->
  <rect x="140" y="280" width="120" height="4" rx="2" fill="url(#accent)" opacity="0.4"/>
  <rect x="155" y="290" width="90" height="3" rx="1.5" fill="url(#accent2)" opacity="0.3"/>
  <rect x="165" y="298" width="70" height="2" rx="1" fill="url(#accent)" opacity="0.2"/>

  <!-- Text -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#accent)" letter-spacing="6">CIVICSENSE</text>
  <text x="200" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" letter-spacing="8">DRIVING</text>
</svg>
