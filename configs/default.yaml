# ── Driving-CivicSense-Vision-Model Default Config ────
# TODO: Tune these values after real-world validation.

# Model
model:
  path: "weights/best-int8.onnx"      # INT8 quantized ONNX model
  conf_threshold: 0.5
  iou_threshold: 0.45
  input_width: 640
  input_height: 640
  classes:
    - stop_sign
    - traffic_light
    - crosswalk
    - vehicle
    - truck
    - bus
    - intersection_zone

# Camera
camera:
  focal_length: 650            # Approximate (will calibrate per device)
  frame_width: 1280
  frame_height: 720
  fps: 30

# Tracking
tracking:
  max_cosine_distance: 0.2
  max_age: 30
  n_init: 3

# Intersection Module
intersection:
  stop_sign_warning_distance: 50   # feet
  stop_sign_warning_speed: 10      # mph
  blocked_intersection_speed: 15   # mph
  blocked_distance_to_stop: 30     # feet
  grid_resolution: 0.5             # meters per cell
  grid_ahead_distance: 20          # meters

# Lane Speed Module
lane_speed:
  speed_diff_threshold: 5          # mph
  hysteresis_seconds: 3
