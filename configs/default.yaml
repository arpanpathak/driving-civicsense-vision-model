# ── Driving-CivicSense-Vision-Model Default Config ────
# TODO: Tune these values after real-world validation.
# (Mirrors src/config.rs struct, keep in sync)

model:
  path: "weights/best-int8.onnx"
  conf_threshold: 0.5
  iou_threshold: 0.45
  input_width: 640
  input_height: 640
  classes:
    - stop_sign
    - traffic_light
    - crosswalk
    - vehicle
    - truck
    - bus
    - intersection_zone

camera:
  focal_length: 650
  frame_width: 1280
  frame_height: 720
  fps: 30

tracking:
  max_cosine_distance: 0.2
  max_age: 30
  n_init: 3

intersection:
  stop_sign_warning_distance: 50     # feet
  stop_sign_warning_speed: 10        # mph
  blocked_intersection_speed: 15     # mph
  blocked_distance_to_stop: 30       # feet
  grid_resolution: 0.5               # meters/cell
  grid_ahead_distance: 20            # meters

lane_speed:
  speed_diff_threshold: 5            # mph
  hysteresis_seconds: 3
