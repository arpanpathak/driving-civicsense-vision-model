[package]
name = "driving-civicsense-vision-model"
version = "0.1.0"
description = "AI-driven auxiliary perception for intersection discipline and lane-awareness — built in Rust"
authors = ["Arpan Pathak <arpanpathak1996@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/arpanpathak/driving-civicsense-vision-model"
homepage = "https://github.com/arpanpathak/driving-civicsense-vision-model"
keywords = ["computer-vision", "adas", "traffic-safety", "edge-ai", "yolo"]
categories = ["multimedia::video", "science::robotics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
ort = { version = "2.0.0-rc.12", default-features = true, features = ["download-binaries", "load-dynamic"] }
ndarray = "0.17"



[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "civicsense"
path = "src/lib.rs"

[[bin]]
name = "civicsense"
path = "src/main.rs"
