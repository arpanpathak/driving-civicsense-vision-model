<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf3ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1060" height="700" rx="12" fill="#fdfbfa"/>

  <text x="530" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">CivicSense Field-Validation Pipeline</text>
  <text x="530" y="66" text-anchor="middle" font-size="14" fill="#64748b">synchronised snapshots score the kinematic decision engine against human ground truth</text>

  <!-- Row 1: sources -->
  <g>
    <rect x="60" y="100" width="280" height="80" rx="10" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="200" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Dashcam capture</text>
    <text x="200" y="148" text-anchor="middle" font-size="11" fill="#64748b">30 - 60 fps RGB + frame metadata</text>
    <text x="200" y="164" text-anchor="middle" font-size="11" fill="#94a3b8">every frame time-stamped</text>

    <rect x="390" y="100" width="280" height="80" rx="10" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="530" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Sensors &amp; V2I</text>
    <text x="530" y="148" text-anchor="middle" font-size="11" fill="#64748b">OBD-II speed - GNSS position</text>
    <text x="530" y="164" text-anchor="middle" font-size="11" fill="#94a3b8">SPaT phase &amp; timing</text>

    <rect x="720" y="100" width="280" height="80" rx="10" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="860" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Human annotation</text>
    <text x="860" y="148" text-anchor="middle" font-size="11" fill="#64748b">outcome + expected warning level</text>
    <text x="860" y="164" text-anchor="middle" font-size="11" fill="#94a3b8">what a correct co-pilot should say</text>
  </g>

  <line x1="200" y1="180" x2="350" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="180" x2="530" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="180" x2="710" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: synchronised snapshot -->
  <rect x="200" y="227" width="660" height="92" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="530" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">1. Synchronised snapshot - ground_truth.rs schema</text>
  <text x="530" y="276" text-anchor="middle" font-size="11.5" fill="#c2410c">ego.speed - ego.distance_to_stop_line - light - time_to_red</text>
  <text x="530" y="296" text-anchor="middle" font-size="11.5" fill="#7c5a44">detections[bbox, class_id, speed, lateral_speed, lane] - outcome - expected_level</text>

  <line x1="530" y1="319" x2="530" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: engine vs expected -->
  <rect x="110" y="353" width="380" height="96" rx="12" fill="url(#card)" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">2. Decision engine</text>
  <text x="300" y="404" text-anchor="middle" font-size="12" fill="#3b82f6">evaluate_safety(snapshot)</text>
  <text x="300" y="424" text-anchor="middle" font-size="11.5" fill="#64748b">kinematic rules -> WarningLevel</text>

  <rect x="570" y="353" width="380" height="96" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="2"/>
  <text x="760" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">3. Expected verdict</text>
  <text x="760" y="404" text-anchor="middle" font-size="12" fill="#8b5cf6">human-annotated outcome</text>
  <text x="760" y="424" text-anchor="middle" font-size="11.5" fill="#64748b">the ground truth for scoring</text>

  <line x1="530" y1="401" x2="560" y2="401" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: confusion matrix -->
  <rect x="290" y="486" width="480" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="530" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4. Score - 2x2 confusion matrix per class</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="330" y="522" width="64" height="26" fill="#dcfce7" stroke="#16a34a"/><text x="362" y="539" fill="#15803d">TP</text>
    <rect x="394" y="522" width="64" height="26" fill="#fee2e2" stroke="#ef4444"/><text x="426" y="539" fill="#b91c1c">FP</text>
    <rect x="458" y="522" width="64" height="26" fill="#fee2e2" stroke="#ef4444"/><text x="490" y="539" fill="#b91c1c">FN</text>
    <rect x="522" y="522" width="64" height="26" fill="#dcfce7" stroke="#16a34a"/><text x="554" y="539" fill="#15803d">TN</text>
  </g>
  <text x="638" y="540" fill="#64748b" font-size="11" text-anchor="middle">missed alert = FN</text>

  <line x1="530" y1="449" x2="530" y2="481" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: metrics chips -->
  <g>
    <rect x="100" y="600" width="180" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="190" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">accuracy</text>
    <text x="190" y="644" text-anchor="middle" font-size="11" fill="#64748b">(TP+TN)/N</text>

    <rect x="310" y="600" width="180" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">F1 score</text>
    <text x="400" y="644" text-anchor="middle" font-size="11" fill="#64748b">precision - recall</text>

    <rect x="520" y="600" width="220" height="56" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="630" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">missed-alert rate</text>
    <text x="630" y="644" text-anchor="middle" font-size="11" fill="#64748b">FN / (TP+FN) - the safety metric</text>

    <rect x="770" y="600" width="190" height="56" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
    <text x="865" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">false-alarm rate</text>
    <text x="865" y="644" text-anchor="middle" font-size="11" fill="#64748b">FP / (FP+TN)</text>
  </g>
</svg>
